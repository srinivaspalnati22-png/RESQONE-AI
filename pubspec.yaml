name: resqone_ai
description: "RESQONE-AI — Autonomous Multi-Agency Emergency Intelligence, Sensor Fusion & Rescue Ecosystem"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sensors_plus: ^6.1.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/hospitals.json
    - assets/data/blood_banks.json
    - assets/data/snake_species.json
    - assets/data/accident_records.json
